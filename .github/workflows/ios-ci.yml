name: iOS CI

on:
  push:
    branches: [main, ios14-support]
    tags: ['v*']
  pull_request:
    branches: [main, ios14-support]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 注意：job 级 env 不能引用 runner 上下文（actionlint 会报错），
  # 因此这里只放常量，路径在每个 step 内用 $RUNNER_TEMP 拼接。
  DEPLOYMENT_TARGET: '14.0'

jobs:
  # ---------------------------------------------------------------------
  # 核心包测试：纯 SwiftPM，可在 macOS 上直接 swift test，无需模拟器与签名。
  # ---------------------------------------------------------------------
  core-tests:
    name: Core Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate bundled resources
        run: |
          python3 -m json.tool App/Resources/txtTocRule.json >/dev/null
          python3 -m json.tool App/Resources/httpTTS.json >/dev/null

      - name: Lint project file
        run: plutil -lint Legado.xcodeproj/project.pbxproj >/dev/null

      - name: Check trailing whitespace
        run: |
          if grep -rnE '[[:blank:]]+$' --include='*.swift' App Sources Tests; then
            echo "Trailing whitespace found" >&2
            exit 1
          fi

      # 与 scripts/self-check.sh 第 3 步保持一致：SwiftPM 在 CI 上需要独立缓存目录，
      # 且 --disable-sandbox 是该仓库既有约定。
      - name: Run core tests
        run: |
          mkdir -p .build/cache/clang .build/cache/swiftpm
          XDG_CACHE_HOME="$PWD/.build/cache" \
          CLANG_MODULE_CACHE_PATH="$PWD/.build/cache/clang" \
          SWIFTPM_MODULECACHE_OVERRIDE="$PWD/.build/cache/clang" \
          swift test --disable-sandbox

      - name: Confirm deployment target is iOS 14
        run: |
          count=$(grep -c "IPHONEOS_DEPLOYMENT_TARGET = ${DEPLOYMENT_TARGET};" \
            Legado.xcodeproj/project.pbxproj || true)
          echo "configs pinned to iOS ${DEPLOYMENT_TARGET}: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "::warning::未在工程文件中找到 IPHONEOS_DEPLOYMENT_TARGET=${DEPLOYMENT_TARGET}"

          fi

  # ---------------------------------------------------------------------
  # 无签名设备构建 + 打包 IPA。
  # ---------------------------------------------------------------------
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 45
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare build paths
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/LegadoDerivedData" >> "$GITHUB_ENV"
          echo "构建目录：$RUNNER_TEMP/LegadoDerivedData"

      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/LegadoDerivedData/SourcePackages
            ~/.swiftpm
          key: ${{ runner.os }}-build-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Legado.xcodeproj \
            -scheme Legado \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/LegadoDerivedData/SourcePackages"

      # 部署目标沿用工程文件中的 14.0，不再从命令行覆盖，
      # 避免与 pbxproj 产生分歧。
      # tee + PIPESTATUS 保证 xcodebuild 的真实退出码不被 tee 吞掉。
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "${{ runner.temp }}/LegadoBuild.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # fork 仓库无 admin 权限时无法通过 API 拉取 job 日志，
      # 因此把编译错误直接汇总到 run摘要，便于快速定位。
      - name: Summarize build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          {
            echo '### 编译错误摘要'
            echo ''
            echo '```'
            grep -nE "error:|error " "$LOG" | grep -vE "^\s*$" | head -60 || echo '未匹配到 error 行'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment target of built binary
        run: |
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Legado.app"
          test -d "$APP" || { echo "未生成 .app：$APP" >&2; exit 1; }
          # PlistBuddy 读取打包产物的真实 MinimumOSVersion，确认与目标一致。
          MIN=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" 2>/dev/null || echo "unknown")
          echo "打包产物 MinimumOSVersion = ${MIN}"
          echo "目标 = ${DEPLOYMENT_TARGET}"
          case "$MIN" in
            14.*)
              echo "已确认产物最低版本为 iOS 14"
              ;;
            *)
              echo "::error::产物 MinimumOSVersion=${MIN}，期望 14.x"
              exit 1
              ;;
          esac

      - name: Package unsigned IPA
        run: |
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Legado.app"
          IPA_DIR="${{ runner.temp }}/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/Legado.app"
          # 未签名的 .app 直接压缩即可，无需重建签名结构。
          (cd "$IPA_DIR" && /usr/bin/zip -qry "Legado-unsigned-ipa14.ipa" Payload)
          ls -lh "$IPA_DIR/Legado-unsigned-ipa14.ipa"
          echo "IPA_PATH=$IPA_DIR/Legado-unsigned-ipa14.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-app
          path: ${{ runner.temp }}/LegadoDerivedData/Build/Products/Release-iphoneos/Legado.app
          retention-days: 30

      - name: Upload build log bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Legado-xcresult
          path: ${{ runner.temp }}/LegadoBuild.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Legado-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------
  # Tag 触发时发布 IPA。
  # ---------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: Legado-unsigned-IPA
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Legado-unsigned-ipa14.ipa
          generate_release_notes: true
          draft: false
          body: |
            ## 小浣熊阅读（iOS 14适配版）

            未签名 IPA，需自行签名后安装。

            - 最低系统版本：**iOS 14.0**（建议 iOS 14.7.1）
            - 免费Apple 账号自签有效期通常为 7 天，到期需重新签名
            - 已支持 TrollStore 的设备可尝试直接安装